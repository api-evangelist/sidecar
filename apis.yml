name: Sidecar
description: >-
  Sidecar (side.cr) was added to the API Evangelist network as a Union Square Ventures
  portfolio lead. The side.cr domain today hosts a transportation news and information
  content platform (self-described as "building the largest transportation news source
  powered by everyday people"), covering ridesharing, driving, delivery, safety, and
  automotive topics for riders and drivers. It is a reader-facing editorial site, not a
  developer platform: as of this enrichment pass it publishes no API, developer portal,
  documentation, SDKs, OpenAPI, or any /.well-known discovery surface. The name echoes the
  pioneering peer-to-peer Sidecar ridesharing company that Union Square Ventures backed and
  that wound down in 2015, but the current content site states no operational or corporate
  ties to that defunct service. This profile is retained as a company/lead record with no
  active API surface to enrich.
